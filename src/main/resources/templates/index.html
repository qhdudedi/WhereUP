<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Store</title>
    <!-- Google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">

</head>
<body>
<header th:replace="~{fragments/header::header}"></header>
<div class="body-container">
    <main>
        <div class="main-container">
            <section class="content" th:each="board: ${summariesTop}" th:id="'section-' + ${board.id}">
                <div class="text-content">
                    <div class="text-c">
                        <span class="label"> </span>
                    </div>
                    <span>24.06.17 ~ 24.06.23</span>
                    <div class="h1-box">
                        <h1> 6월 셋째 주,<br>팝업 전시에서 <br></t>특별한 순간을 함께하세요!</h1>
                        <h2 th:text="${board.subject}"></h2>
                    </div>
<!--                    <p th:text="${board.description}"></p>-->
                     <p th:text="${board.start_date} + ' ~ ' + ${board.end_date}"></p>
                    <div class="buttons">
                        <a th:href="@{'/board/' + ${board.id}}">
                            <button class="btn primary-btn">자세히 보기</button>
                        </a>
                        <a href="/board/boardList?page=1" class="btn secondary-btn">팝업스토어 전체 보기</a>
                    </div>
                </div>

                <div class="image-content">
                    <img th:src="${board.imageUrl}">
                </div>
            </section>
            <a class="main-prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="main-next" onclick="plusSlides(1)">&#10095;</a>
        </div>
    </main>
    <!-- MENU ICON Section -->
    <div class="content-container">
        <section class="options">
            <div class="option" onclick="location.href='/board/locationList';">
                <img src="/img/icon/map.png" alt="Location Icon">
                <h2>지역별 팝업 스토어 보기</h2>
                <p>원하는 지역에 팝업스토어를 확인해보세요 :0</p>
            </div>
            <div class="option" onclick="location.href='/post/postList?page=1';">
                <img src="/img/icon/review.png" alt="Review Icon">
                <h2>팝업스토어 리뷰 보기</h2>
                <p>사람들의 다양한 후기를 만나보세요</p>
            </div>
        </section>

    </div>
    <section class="popup-stores">
        <div class="slideshow-container">
            <div class="board-container">
                <div th:each="board : ${summaries}" class="board-item">
                    <img th:src="${board.imageUrl}">
                    <div class="details">
                        <h5><a th:href="'/board/' + ${board.id}" th:text="${board.subject}"></a></h5>
                        <h6 th:text="${board.start_date} + ' ~ ' + ${board.end_date}"></h6>
                    </div>
                </div>
            </div>
            <a class="prev" onclick="plusBoardSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusBoardSlides(1)">&#10095;</a>
        </div>
    </section>
    <footer th:replace="~{fragments/footer::footer}"></footer>
    <script>
        // 기존 슬라이드 기능
        let currentIndex = 0;

        function showSlide(index) {
            let slides = document.querySelectorAll('.content');
            if (index >= slides.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = slides.length - 1;
            } else {
                currentIndex = index;
            }
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === currentIndex);
            });
        }

        function plusSlides(n) {
            showSlide(currentIndex + n);
        }
        document.addEventListener('DOMContentLoaded', () => {
            showSlide(currentIndex);
        });

        // 새로운 보드 슬라이드쇼 기능
        let boardIndex = 0;

        function plusBoardSlides(n) {
            boardIndex += n;
            const slides = document.querySelectorAll('.board-item');
            const totalSlides = slides.length;
            const slidesPerView = 3;
            const maxIndex = totalSlides - slidesPerView;

            if (boardIndex > maxIndex) {
                boardIndex = maxIndex;
            }
            if (boardIndex < 0) {
                boardIndex = 0;
            }

            slides.forEach((slide, i) => {
                slide.style.transform = `translateX(${-100 * boardIndex}%)`;
            });
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            plusBoardSlides(0);
        });
    </script>
</div>
<footer th:replace="~{fragments/footer::footer}"></footer>

</body>
</html>
