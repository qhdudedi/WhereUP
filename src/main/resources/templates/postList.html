<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PostList</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/post.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
</head>
<body>
<header th:replace="~{fragments/header::header}"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a th:href="'/post/postList?page=1'">목록</a></li>
            <div th:if="${detail} == All">
            </div>
            <div th:if="${detail} == Search">
                <li><a th:text="${detail} + '(' + ${keyword} + ')'"  th:href="'/post/search/' + ${keyword} + '?page=1'"></a></li>
            </div>
        </ul>

        <div class="btn-container" th:if="${user} != null">
            <input type="button" value="글 작성" onclick="location.href='/post/newPost'" class="create-btn">
        </div>
    </div>
    <div class="post-container">
        <div th:each="post : ${list}" class="post-item">
            <img th:src="${post.thumbnail != null ? post.thumbnail : 'https://d1pssi2485491c.cloudfront.net/admin/whereup.png'}">
            <div class="details">
                <h5 ><a th:href="'/post/' + ${post.id}" th:text="${post.title}"></a></h5>
                <h6 th:text="${post.author}"></h6>
                <h6 th:text="${post.created_date}"></h6>
            </div>
        </div>
    </div>
    </div>
    <div class="page-list">
        <ul>
            <div th:if="${detail} == All">
                <li th:each="i : ${#numbers.sequence(1, pageCount)}"><a th:href="'/postList?page=' + ${i}" th:text="${i}"></a></li>
            </div>
            <div th:if="${detail} == Search">
                <li th:each="i : ${#numbers.sequence(1, pageCount)}"><a th:href="'/post/search/'+ ${keyword} + '?page=' + ${i}" th:text="${i}"></a></li>
            </div>
        </ul>
    </div>
</div>
<footer th:replace="~{fragments/footer::footer}"></footer>
</body>
</html>
