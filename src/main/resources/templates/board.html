<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #eff3fb;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
        }
        .header {
            margin-bottom: 20px;
        }
        .header ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
        }
        .header ul li {
            display: inline;
            margin-right: 10px;
            position: relative;
        }
        .header ul li::after {
            content: '>';
            position: absolute;
            right: -10px;
            top: 0;
        }
        .header ul li:last-child::after {
            content: '';
        }
        .header ul li a {
            text-decoration: none;
            color: #007bff;
        }
        .content-wrapper {
            display: flex;
            align-items: flex-start;
        }
        .slideshow-container {
            position: relative;
            width: 50%;
            margin-right: 20px;
        }
        .slideshow-image {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }
        .slideshow-image.active {
            display: block;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.5);
        }
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .prev {
            left: 0;
            border-radius: 3px 0 0 3px;
        }
        .content {
            width: 50%;
        }
        .content h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }
        .content p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }
        .details ul {
            list-style: none;
            padding: 0;
        }
        .details ul li {
            margin-bottom: 10px;
            text-align: left;
        }
        .details ul li strong {
            color: #333;
        }
        .details ul li span {
            color: #555;
        }
        .details ul li a {
            color: #007bff;
            text-decoration: none;
        }
        @media (max-width: 900px) {
            .content-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .slideshow-container, .content {
                width: 100%;
            }
            .slideshow-container {
                margin-right: 0;
                margin-bottom: 20px;
            }
            .content h1 {
                font-size: 1.75em;
            }
            .content p {
                font-size: 1em;
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            .content h1 {
                font-size: 1.5em;
            }
            .content p {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <ul>
            <li><a href="/board/boardList">BoardList</a></li>
            <li th:text="${board.id}"></li>
        </ul>
    </div>
    <div class="content-wrapper">
        <div class="slideshow-container">
            <div th:each="url, stat : ${img_url}">
                <img th:src="${url}" alt="image" class="slideshow-image" th:classappend="${stat.index == 0} ? ' active' : ''">
            </div>
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <div class="content">
            <h1 th:text="${board.subject}"></h1>
            <p th:text="${board.description}"></p>
            <div class="details">
                <ul>
                    <li>
                        <strong>장소: </strong>
                        <span th:text="${board.location}"></span>
                    </li>
                    <li>
                        <strong>날짜: </strong>
                        <span th:text="(${board.start_date} + ' ~ ' + ${board.end_date})"></span>
                    </li>
                    <li>
                        <strong>브랜드: </strong>
                        <span th:text="${board.brand}"></span>
                    </li>
                    <li>
                        <strong>티켓 필요: </strong>
                        <span th:text="${board.ticket} ? 'Yes' : 'No'"></span>
                    </li>
                    <li>
                        <strong>링크: </strong>
                        <span>
                            <a th:href="${board.link}" th:text="${board.link}"></a>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script src="js/whereup-boardImgNext.js"></script>
</body>
</html>
