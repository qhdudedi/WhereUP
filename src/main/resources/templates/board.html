<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<header th:replace="fragments/header::header"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a href="/board/boardList?page=1">BoardList</a></li>
            <li th:text="${board.id}"></li>
        </ul>
    </div>
    <div class="content-wrapper">
        <div class="slideshow-container">
            <div th:each="url, stat : ${img_url}">
                <img th:src="${url}" alt="image" class="slideshow-image"
                     th:classappend="${stat.index == 0} ? ' active' : ''">
            </div>
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <div class="content">
            <h1 th:text="${board.subject}"></h1>
            <p th:text="${board.description}"></p>
            <div class="details">
                <ul>
                    <li>
                        <strong>장소: </strong>
                        <span th:text="${board.location}"></span>
                    </li>
                    <li>
                        <strong>날짜: </strong>
                        <span th:text="(${board.start_date} + ' ~ ' + ${board.end_date})"></span>
                    </li>
                    <li>
                        <strong>브랜드: </strong>
                        <span th:text="${board.brand}"></span>
                    </li>
                    <li>
                        <strong>티켓 필요: </strong>
                        <span th:text="${board.ticket} ? 'Yes' : 'No'"></span>
                    </li>
                    <li>
                        <strong>링크: </strong>
                        <span>
                            <a th:href="${board.link}" th:text="${board.link}"></a>
                        </span>
                    </li>
                    <li>
                        <button type="button" th:attr="data-board-id=${board.id}" class="like-btn">
                            <i th:classappend="${isLiked} ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"
                               th:style="${isLiked} ? 'color: #e03e3e;' : 'color: #000;'"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<footer th:replace="fragments/footer::footer"></footer>
<script src="/js/whereup-boardImgNext.js"></script>
<script>
    $(document).ready(function () {
        $('.like-btn').on('click', function () {
            var button = $(this);
            var boardId = button.data('board-id');
            $.post("/board/" + boardId + "/like", function () {
                var icon = button.find('i');
                if (icon.hasClass('fa-regular')) {
                    icon.removeClass('fa-regular fa-heart');
                    icon.addClass('fa-solid fa-heart');
                    icon.css('color', '#e03e3e');
                } else {
                    icon.removeClass('fa-solid fa-heart');
                    icon.addClass('fa-regular fa-heart');
                    icon.css('color', '#000');
                }
            });
        });
    });
</script>

</body>
</html>
