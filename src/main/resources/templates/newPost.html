<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Post</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/post.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
</head>
<body>
<header th:replace="~{fragments/header::header}"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a href="/post/postList?page=1">PostList</a></li>
            <li>newPost</li>
        </ul>
    </div>
    <form id="postForm" method="post" action="/post/newPost">
        <h4>제목: <input type="text" name="title" id="title"></h4>
        <div>
            <strong>작성자: </strong>
            <input type="text" name="author" id="author" th:value="${author}" readonly>
        </div>
        <div>
            <strong>내용: </strong>
            <textarea class="simplemde" name="content" id="content"></textarea>
        </div>
        <input type="file" id="imageUpload" style="display:none" accept="image/*">
        <input type="submit" value="submit">
    </form>
</div>
<footer th:replace="~{fragments/footer::footer}"></footer>
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script src="/js/whereup-simplemdeCustom.js"></script>
<script src="/js/whereup-postValidCheck.js"></script>
</body>
</html>
