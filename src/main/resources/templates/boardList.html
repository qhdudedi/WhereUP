<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BoardList</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
</head>
<body>
<header th:replace="~{fragments/header::header}"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a th:href="'/board/boardList?page=1'">목록</a></li>
            <div th:if="${detail} == Search">
                <li><a th:text="${detail} + '(' + ${keyword} + ')'"  th:href="'/board/search/' + ${keyword} + '?page=1'"></a></li>
                <li th:text="'page(' + ${page} + ')'"></li>
            </div>
        </ul>
    </div>
    <div class="board-container">
        <div th:each="board : ${summaries}" class="board-item">
            <img th:src="${board.imageUrl}">
            <div class="details">
                <pre><a th:href="'/board/' + ${board.id}" th:text="${board.subject}"></a></pre>
                <h6 th:text="${board.start_date} + ' ~ ' + ${board.end_date}"></h6>
            </div>
        </div>
    </div>
    <div class="page-list">
        <ul>
            <div th:if="${detail} == All">
                <li th:each="i : ${#numbers.sequence(1, pageCount)}"><a th:href="'/board/boardList?page=' + ${i}" th:text="${i}"></a></li>
            </div>
            <div th:if="${detail} == Search">
                <li th:each="i : ${#numbers.sequence(1, pageCount)}"><a th:href="'/board/search/'+ ${keyword} +'?page=' + ${i}" th:text="${i}"></a></li>
            </div>
        </ul>
    </div>
</div>
<footer th:replace="~{fragments/footer::footer}"></footer>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const titles = document.querySelectorAll(".title");
        titles.forEach(title => {
            let fontSize = parseInt(window.getComputedStyle(title).fontSize);
            while (title.scrollWidth > title.clientWidth && fontSize > 10) {
                fontSize--;
                title.style.fontSize = fontSize + "px";
            }
        });
    });
</script>
</body>
</html>
