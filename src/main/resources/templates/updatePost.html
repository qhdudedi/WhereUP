<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Post</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #eff3fb;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
        }
        .header-list {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-list ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        .header-list ul li {
            display: inline;
            margin-right: 10px;
            position: relative;
        }
        .header-list ul li::after {
            content: '>';
            position: absolute;
            right: -10px;
            top: 0;
        }
        .header-list ul li:last-child::after {
            content: '';
        }
        .header-list ul li a {
            text-decoration: none;
            color: #007bff;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        form h4 {
            margin: 0 0 20px;
        }
        form input[type="text"], form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        form input[type="submit"] {
            width: 25%;
            background-color: #98accf;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-self: flex-end;
        }
        form input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a href="/post/postList">PostList</a></li>
            <li>editPost</li>
        </ul>
    </div>
    <form method="post" action="/post/updatePost">
        <input type="hidden" name="id" id="id" th:value="${post.id}">
        <input type="hidden" name="created_date" id="created_date" th:value="${post.created_date}">
        <h4>제목: <input type="text" name="title" id="title" th:value="${post.title}"></h4>
        <div>
            <strong>작성자: </strong>
            <input type="text" name="author" id="author" th:value="${post.author}" readonly>
        </div>
        <div>
            <strong>내용: </strong>
            <textarea class="simplemde" name="content" id="content" th:text="${post.content}"></textarea>
        </div>
        <input type="file" id="imageUpload" style="display:none" accept="image/*">
        <input type="submit" value="submit">
    </form>
</div>
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script src="/js/whereup-simplemdeCustom.js"></script>
</body>
</html>
