<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Post</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/post.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
</head>
<body>
<header th:replace="fragments/header::header"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a href="/post/postList">PostList</a></li>
            <li>updatePost</li>
        </ul>
    </div>
    <form id="postForm" method="post" action="/post/updatePost">
        <input type="hidden" name="id" id="id" th:value="${post.id}">
        <input type="hidden" name="created_date" id="created_date" th:value="${post.created_date}">
        <h4>제목: <input type="text" name="title" id="title" th:value="${post.title}"></h4>
        <div>
            <strong>작성자: </strong>
            <input type="text" name="author" id="author" th:value="${post.author}" readonly>
        </div>
        <div>
            <strong>내용: </strong>
            <textarea class="simplemde" name="content" id="content" th:text="${post.content}"></textarea>
        </div>
        <input type="file" id="imageUpload" style="display:none" accept="image/*">
        <input type="submit" value="submit">
    </form>
</div>
<footer th:replace="fragments/footer::footer"></footer>
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script src="/js/whereup-simplemdeCustom.js"></script>
<script src="/js/whereup-postValidCheck.js"></script>
</body>
</html>
