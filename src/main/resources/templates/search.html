<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/boardAndPost.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/post.css">
    <link rel="stylesheet" href="/css/headerAndFooter.css">
</head>
<body>
<header th:replace="~{fragments/header::header}"></header>
<div class="container">
    <div class="header-list">
        <ul>
            <li><a th:text="'Search(' + ${keyword} + ')'"></a></li>
        </ul>
    </div>
    <section class="each-container">
        <div class="board-container">
            <div th:each="board : ${summaries}" class="board-item">
                <img th:src="${board.imageUrl}">
                <div class="details">
                    <h5><a th:href="'/board/' + ${board.id}" th:text="${board.subject}"></a></h5>
                    <h6 th:text="${board.start_date} + ' ~ ' + ${board.end_date}"></h6>
                </div>
            </div>
            <div><a  th:href="'/board/search/' + ${keyword} + '?page=1'">더보기</a></div>
        </div>
    </section>
    <section class="each-container">
        <div class="post-container">
            <div th:each="post : ${list}" class="post-item">
                <img th:src="${post.thumbnail != null ? post.thumbnail : '/img/whereup.png'}">
                <div class="details">
                    <h5 ><a th:href="'/post/' + ${post.id}" th:text="${post.title}"></a></h5>
                    <h6 th:text="${post.author}"></h6>
                    <h6 th:text="${post.created_date}"></h6>
                </div>
            </div>
            <div><a th:href="'/post/search/' + ${keyword} + '?page=1'">더보기</a></div>
        </div>
    </section>
</div>
<footer th:replace="~{fragments/footer::footer}"></footer>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const titles = document.querySelectorAll(".title");
        titles.forEach(title => {
            let fontSize = parseInt(window.getComputedStyle(title).fontSize);
            while (title.scrollWidth > title.clientWidth && fontSize > 10) {
                fontSize--;
                title.style.fontSize = fontSize + "px";
            }
        });
    });
</script>
</body>
</html>
