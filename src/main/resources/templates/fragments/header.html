<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div id="header-container" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <header th:fragment="header">
        <div class="logo">
            <img src="/img/whereup.png">
        </div>
        <form class="search-container" action="/search" method="post">
            <input type="hidden" name="what" value="board">
            <input type="text" name="keyword" placeholder="Search">
            <button type="submit">Search</button>
        </form>
        <nav>
            <th:block sec:authorize="isAnonymous()">
                <!-- 인증 받지 않음 -->
                <a href="/login" class="btn btn-outline-grey">로그인</a>
                <a href="/signup" class="btn btn-primary">회원가입</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <!-- 인증 받음 -->
                <a href="/logout" class="icons me-2 ms-2">로그아웃</a>
                <a href="/mypage" class="icons me-2 ms-2">MyPage</a>
            </th:block>
        </nav>

    </header>
</div>
</html>
