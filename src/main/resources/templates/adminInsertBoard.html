<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eff3fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        input[type="checkbox"], input[type="radio"] {
            margin-right: 10px;
        }
        .category-group, .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-group input {
            margin-right: 5px;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<form action="/adminInsertBoard" method="post">
    <label for="subject">Subject:</label>
    <input type="text" id="subject" name="subject" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required></textarea>

    <label for="location">Location:</label>
    <input type="text" id="location" name="location" required>

    <label for="start_date">Start Date:</label>
    <input type="date" id="start_date" name="start_date" required>

    <label for="end_date">End Date:</label>
    <input type="date" id="end_date" name="end_date" required>

    <label for="brand">Brand:</label>
    <input type="text" id="brand" name="brand" required>

    <label for="ticket">Ticket:</label>
    <input type="checkbox" id="ticket" name="ticket">

    <label for="link">Link:</label>
    <input type="text" id="link" name="link" required>

    <div class="category-group">
        <label>Category:</label>
        <div>
            <input type="radio" id="culture" name="category" value="문화" checked>
            <label for="culture">문화</label>
            <input type="radio" id="fashion" name="category" value="패션">
            <label for="fashion">패션</label>
            <input type="radio" id="life" name="category" value="생활">
            <label for="life">생활</label>
        </div>
    </div>

    <div class="button-group">
        <input type="submit" value="InsertGo">
    </div>
</form>
</body>
</html>
